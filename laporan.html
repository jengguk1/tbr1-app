<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan — Tabungan SDN TAMBERU 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebarSlot"></nav>
  <div class="main">
    <header class="topbar" id="topbarSlot"></header>
    <main class="content">
      <div class="page-head no-print">
        <h2>Laporan</h2>
        <p>Laporan tabungan per siswa — per setoran, per minggu, per bulan, dan per tahun.</p>
      </div>

      <!-- Pengaturan laporan -->
      <div class="panel no-print" style="margin-bottom:16px;">
        <div class="filter-row">
          <div class="field" id="wrapKelasLaporan" style="display:none;">
            <label for="fKelasLaporan">Kelas</label>
            <select id="fKelasLaporan">
              <option value="">Semua Kelas</option>
              <option>Kelas I</option><option>Kelas II</option><option>Kelas III</option>
              <option>Kelas IV</option><option>Kelas V</option><option>Kelas VI</option>
            </select>
          </div>
          <div class="field">
            <label for="fSiswaLaporan">Siswa</label>
            <select id="fSiswaLaporan"><option value="">Memuat...</option></select>
          </div>
          <div class="field">
            <label for="fDari">Dari tanggal</label>
            <input type="date" id="fDari">
          </div>
          <div class="field">
            <label for="fSampai">Sampai tanggal</label>
            <input type="date" id="fSampai">
          </div>
        </div>

        <div class="seg" id="segMode">
          <button type="button" class="seg-btn active" data-mode="transaksi">Per Setoran</button>
          <button type="button" class="seg-btn" data-mode="minggu">Per Minggu</button>
          <button type="button" class="seg-btn" data-mode="bulan">Per Bulan</button>
          <button type="button" class="seg-btn" data-mode="tahun">Per Tahun</button>
        </div>

        <div class="filter-actions">
          <label class="chk"><input type="checkbox" id="chkTerbaru"> Terbaru di atas</label>
          <span style="flex:1;"></span>
          <button type="button" class="btn-small" id="btnCetak">🖨️ Cetak</button>
          <button type="button" class="btn-small" id="btnCsv">⬇️ Unduh Excel (CSV)</button>
        </div>
      </div>

      <!-- Kop laporan (hanya muncul saat dicetak) -->
      <div class="print-only" id="printHeader"></div>

      <!-- Ringkasan -->
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-top"><div class="stat-icon"><img src="assets/img/icon-catatan.png" alt=""></div><div class="stat-label">Saldo Awal</div></div>
          <div class="stat-value" id="lapSaldoAwal">Rp 0</div>
          <div class="stat-sub" id="lapSaldoAwalSub">Awal pencatatan</div>
        </div>
        <div class="stat-card">
          <div class="stat-top"><div class="stat-icon"><img src="assets/img/icon-tabungan.png" alt=""></div><div class="stat-label">Total Pemasukan</div></div>
          <div class="stat-value amt-in" id="lapMasuk">Rp 0</div>
          <div class="stat-sub" id="lapMasukSub">0 kali setoran</div>
        </div>
        <div class="stat-card">
          <div class="stat-top"><div class="stat-icon"><img src="assets/img/icon-transaksi.png" alt=""></div><div class="stat-label">Total Penarikan</div></div>
          <div class="stat-value amt-out" id="lapKeluar">Rp 0</div>
          <div class="stat-sub" id="lapKeluarSub">0 kali penarikan</div>
        </div>
        <div class="stat-card">
          <div class="stat-top"><div class="stat-icon"><img src="assets/img/icon-laporan.png" alt=""></div><div class="stat-label">Saldo Akhir</div></div>
          <div class="stat-value" id="lapSaldoAkhir">Rp 0</div>
          <div class="stat-sub">Saldo Awal + Pemasukan − Penarikan</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3 id="judulTabel">Rincian Per Setoran</h3></div>
        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead id="theadLaporan"></thead>
            <tbody id="tbodyLaporan">
              <tr><td style="text-align:center; color:#94a1bd; padding:20px;">Memuat data...</td></tr>
            </tbody>
            <tfoot id="tfootLaporan"></tfoot>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/laporan.js"></script>
<script>initLayout("laporan", "Laporan").then(() => initLaporanPage());</script>
</body>
</html>
