<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/icons/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/icons/icon-192.png">
<meta name="theme-color" content="#0b1e42">
<title>Atur Ulang Password — Tabungan SDN TAMBERU 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/img/icon-tabungan.png" alt="" style="width:64px;height:64px;display:block;margin:0 auto 14px;">
      <h1>Atur Password Baru</h1>
      <p class="sub">Tabungan SDN TAMBERU 1</p>

      <div class="form-msg" id="resetMsg"></div>

      <form id="formReset">
        <div class="field">
          <label for="rPass1">Password Baru</label>
          <div class="pass-wrap">
            <input type="password" id="rPass1" placeholder="Minimal 6 karakter" minlength="6" required>
            <button type="button" class="pass-toggle" data-target="rPass1">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="rPass2">Ulangi Password Baru</label>
          <div class="pass-wrap">
            <input type="password" id="rPass2" placeholder="Ketik ulang password baru" minlength="6" required>
            <button type="button" class="pass-toggle" data-target="rPass2">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="btnSimpanReset">Simpan Password Baru</button>
      </form>

      <p style="text-align:center; margin-top:16px;">
        <a href="index.html" style="font-size:12.5px; color:var(--blue);">Kembali ke halaman masuk</a>
      </p>
    </div>
  </div>

  <script src="assets/js/supabase-client.js"></script>
  <script>
    document.querySelectorAll(".pass-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.target);
        const showing = input.type === "text";
        input.type = showing ? "password" : "text";
        btn.textContent = showing ? "👁" : "🙈";
      });
    });

    const msgBox = document.getElementById("resetMsg");
    function showMsg(text, type) {
      msgBox.textContent = text;
      msgBox.className = "form-msg" + (type ? " form-msg-" + type : "");
      msgBox.style.display = text ? "block" : "none";
    }

    // Link dari email membawa token khusus di URL — Supabase otomatis membacanya
    // saat client dibuat. Kalau tidak ada sesi pemulihan yang valid, beri tahu penggunanya.
    window.db.auth.getSession().then(({ data: { session } }) => {
      if (!session) {
        showMsg("Link ini sudah tidak berlaku atau tidak valid. Minta admin mengirim ulang link reset password.", "error");
        document.getElementById("formReset").querySelectorAll("input, button").forEach(el => el.disabled = true);
      }
    });

    document.getElementById("formReset").addEventListener("submit", async (e) => {
      e.preventDefault();
      showMsg("", null);
      const p1 = document.getElementById("rPass1").value;
      const p2 = document.getElementById("rPass2").value;
      if (p1 !== p2) { showMsg("Password baru dan ulangi password tidak sama.", "error"); return; }
      if (p1.length < 6) { showMsg("Password minimal 6 karakter.", "error"); return; }

      const btn = document.getElementById("btnSimpanReset");
      btn.disabled = true;
      btn.textContent = "Menyimpan...";
      try {
        const { error } = await window.db.auth.updateUser({ password: p1 });
        if (error) throw error;
        showMsg("Password berhasil diganti. Mengarahkan ke halaman masuk...", "success");
        await window.db.auth.signOut();
        setTimeout(() => { window.location.href = "index.html"; }, 1800);
      } catch (err) {
        showMsg("Gagal menyimpan password: " + (err.message || err), "error");
        btn.disabled = false;
        btn.textContent = "Simpan Password Baru";
      }
    });
  </script>
</body>
</html>
