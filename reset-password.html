<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://kpgzdnpbhvfstrrdjwum.supabase.co wss://kpgzdnpbhvfstrrdjwum.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/icons/favicon-64.png">

<title>Atur Ulang Password — Tabungan SDN TAMBERU 1</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/img/icon-tabungan.webp" alt="" style="width:64px;height:64px;display:block;margin:0 auto 14px;">
      <h1>Atur Password Baru</h1>
      <p class="sub">Tabungan SDN TAMBERU 1</p>

      <div class="form-msg" id="resetMsg"></div>

      <form id="formReset">
        <div class="field">
          <label for="rPass1">Password Baru</label>
          <div class="pass-wrap">
            <input type="password" id="rPass1" placeholder="Minimal 8 karakter" minlength="8" required>
            <button type="button" class="pass-toggle" data-target="rPass1">👁</button>
          </div>
        </div>
        <div class="field">
          <label for="rPass2">Ulangi Password Baru</label>
          <div class="pass-wrap">
            <input type="password" id="rPass2" placeholder="Ketik ulang password baru" minlength="8" required>
            <button type="button" class="pass-toggle" data-target="rPass2">👁</button>
          </div>
        </div>
        <button type="submit" class="btn-primary" id="btnSimpanReset">Simpan Password Baru</button>
      </form>

      <p style="text-align:center; margin-top:16px;">
        <a href="index.html" style="font-size:12.5px; color:var(--blue);">Kembali ke halaman masuk</a>
      </p>
    </div>
  </div>

  <script src="assets/js/boot.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/halaman-reset.js"></script>
