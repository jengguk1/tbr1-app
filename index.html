<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://kpgzdnpbhvfstrrdjwum.supabase.co wss://kpgzdnpbhvfstrrdjwum.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/img/icons/favicon-64.png">
<link rel="apple-touch-icon" href="assets/img/icons/icon-192.png">

<title>Masuk — Tabungan SDN TAMBERU 1</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img src="assets/img/icon-tabungan.webp" alt="" style="width:64px;height:64px;display:block;margin:0 auto 14px;">
      <h1>Tabungan SDN TAMBERU 1</h1>
      <p class="sub" id="loginSub">Kecamatan Batumarmar — Kabupaten Pamekasan</p>

      <div class="login-error" id="loginError">Email atau kata sandi salah.</div>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="admin@tamberu1.sch.id" required>
        </div>
        <div class="field">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Masuk</button>
      </form>
      <p style="text-align:center; margin-top:14px;">
        <button type="button" id="linkLupaPass" class="link-btn">Lupa password?</button>
      </p>
      <p style="text-align:center; margin-top:2px;"><a href="cek.html" style="font-size:12px; color:var(--text-muted);">🔧 Cek koneksi</a></p>

      <div id="lupaPassBox" style="display:none; margin-top:10px; border-top:1px solid var(--border); padding-top:14px;">
        <div class="form-msg" id="lupaMsg"></div>
        <div class="field">
          <label for="emailLupa">Email akun Anda</label>
          <input type="email" id="emailLupa" placeholder="nama@tamberu1.sch.id">
        </div>
        <button type="button" class="btn-primary" id="btnKirimReset">Kirim Link Reset Password</button>
      </div>
    </div>
  </div>

  <script src="assets/js/boot.js"></script>
<script src="assets/vendor/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/halaman-login.js"></script>
  
</body>
</html>
